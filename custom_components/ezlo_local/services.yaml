zwave_include:
  name: Z-Wave Include
  description: Start Z-Wave inclusion mode to add a new device. Put the device into pairing mode after calling this service.

zwave_stop_include:
  name: Z-Wave Stop Include
  description: Stop Z-Wave inclusion mode.

zwave_exclude:
  name: Z-Wave Exclude
  description: Start Z-Wave exclusion mode to remove a device. Trigger the device after calling this service.

zwave_stop_exclude:
  name: Z-Wave Stop Exclude
  description: Stop Z-Wave exclusion mode.

force_remove_device:
  name: Force Remove Device
  description: Force-remove a device from the hub by its Ezlo device ID or name.
  fields:
    device_id:
      name: Device ID
      description: The Ezlo device ID (from entity attributes or list_devices).
      required: false
      example: "6af78e54376468159702f8e9"
      selector:
        text:
    device_name:
      name: Device Name
      description: The device name (case-insensitive). Used if device_id is not provided.
      required: false
      example: "Balcony"
      selector:
        text:

refresh_devices:
  name: Refresh Devices
  description: Refresh the device list from the hub and reload the integration.

list_devices:
  name: List Devices
  description: Show all devices on the hub as a persistent notification with their details and IDs.
